# Global args config for the current DINO server/backbone code path.
# This file includes all keys that are read with direct global_args[...] access.

# Main runtime keys (used in src/main_mpsl.py and src/models/__init__.py)
partitioner: dirichlet
checkpoint_key: model
subsample_fraction: 1.00
OFFICIAL_EPOCH_LENGTH: 100 
max_shots: 25
eval_epoch: 1
nr_of_epochs: 35
# nr_of_classes: 62
hidden_dim: 768
freeze_server_backbone: True
task_type: single_label_classification
teacher_temp: 0.04
nr_of_clients: 10
dataset_split_type: noniid
batch_size: 16
server_batch_size: 64
random_seed: 2024
small_test_run: false
transforms: "lp"
n_local_crops: 8
test_num_workers: 8
num_workers: 8
gpu_id: 0
alpha: 10000
lr: 0.001
optim:
  lr: 0.001
  min_lr: 1e-3
  epochs: 25
  warmup_epochs: 3
  freeze_last_layer_epochs: 3
  adamw_beta1: 0.9
  adamw_beta2: 0.999
  accum_iter: 4
  clip_grad: 3.0

# Common model options referenced by model selection/building paths
split_layer: 0
fusion_type: default
use_lora: true
lora_rank: 16
lora_alpha: 32

# Required by src/models/dinov2/vit_backbone.py:get_dino_vit_backbone
pretrained_weight_path_client: /home/svhonk/code/SDAPT/checkpoints/dinov2_vitb14_pretrain.pth
checkpoint_key_client: model

train:
  centering: sinkhorn_knopp
  OFFICIAL_EPOCH_LENGTH: 200

teacher:
  teacher_temp: 0.04
  warmup_teacher_temp: 0.04
  warmup_teacher_temp_epochs: 0
  momentum_teacher: 0.996
  final_momentum_teacher: 1.0

dino:
  loss_weight: 1.0
  koleo_loss_weight: 0.0
  head_n_prototypes: 65536
  head_hidden_dim: 2048
  head_bottleneck_dim: 256
  head_nlayers: 3

ibot:
  loss_weight: 0.0
  separate_head: false
  head_n_prototypes: 65536
  head_hidden_dim: 2048
  head_bottleneck_dim: 256
  head_nlayers: 3

lora:
  type: lora
  rank: 64
  layers: 
    - attn
  unfreeze_blocks: [11]
  unfreeze_embed: false
  unfreeze_cls_token: true
  unfreeze_norm: true
  attn_key: false
  attn_proj: false
